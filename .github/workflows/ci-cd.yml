name: Express CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HEROKU_APP_NAME: mazuuur9672-express-lab6
    steps:
      - uses: actions/checkout@v6

      - name: Install Heroku CLI
        run: npm install --global heroku

      - name: Build, push, and release container
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku stack:set container --app "$HEROKU_APP_NAME"
          printf '%s' "$HEROKU_API_KEY" | docker login registry.heroku.com --username _ --password-stdin
          image="registry.heroku.com/$HEROKU_APP_NAME/web"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
          --output type=registry,oci-mediatypes=false -t "$image" .
          heroku container:release web --app "$HEROKU_APP_NAME"
